<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AR Massage Ball</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="hint" role="status" aria-live="polite">Tap "START AR"</div>

  <button id="toggleInfo" aria-expanded="false" aria-controls="infoPanel">Info</button>

  <div id="infoPanel" role="region" aria-label="Therapy Ball information">
    <h3>Massage Ball</h3>
    <ul>
      <li>Latex free — compact & portable</li>
      <li>Blunt spikes for better grip</li>
      <li>Eco friendly tension relief</li>
      <li>Safe for sensitive skin</li>
    </ul>
  </div>

  <div id="arContainer" aria-hidden="false"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
