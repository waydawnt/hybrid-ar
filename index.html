<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Three.js WebXR AR</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:system-ui;
  background:#000;
}

#enterAR {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  padding:16px 24px;
  font-size:18px;
  font-weight:bold;
  border:none;
  border-radius:10px;
  background:#00d0c0;
  color:#002;
  z-index:999;
}

#hint {
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 14px;
  border-radius:999px;
  background:rgba(0,0,0,.6);
  color:white;
  z-index:999;
}
</style>
</head>

<body>

<div id="hint">Tap ENTER AR</div>
<button id="enterAR">ENTER AR</button>

<script type="module" src="main.js"></script>

</body>
</html>
