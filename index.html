<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AR Therapy Ball</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>

html,body{
  margin:0;
  height:100%;
  font-family:system-ui;
  background:black;
  color:white;
}

/* Hint bubble */

#hint{
  position:fixed;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 14px;
  border-radius:999px;
  background:rgba(0,0,0,.6);
  z-index:9999;
}

/* Info toggle */

#toggleInfo{
  position:fixed;
  top:14px;
  right:14px;
  padding:8px 14px;
  border:none;
  border-radius:999px;
  background:rgba(255,255,255,.15);
  color:white;
  font-weight:bold;
  backdrop-filter:blur(6px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:9999;
}

#toggleInfo.show{
  opacity:1;
  pointer-events:auto;
}

/* Info panel */

#infoPanel{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  max-width:480px;
  background:white;
  color:black;
  border-radius:16px;
  padding:16px;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
  display:none;
  z-index:9999;
}

#infoPanel h3{
  margin:0 0 8px;
}

#arContainer{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;
}

canvas{
  position:fixed;
  inset:0;
}

</style>
</head>

<body>

<div id="hint">Tap ENTER AR</div>

<button id="toggleInfo">Info</button>

<div id="infoPanel">
<h3>Therapy Ball</h3>
<ul>
<li>Latex free — compact & portable</li>
<li>Blunt spikes for better grip</li>
<li>Eco friendly tension relief</li>
<li>Safe for sensitive skin</li>
</ul>
</div>

<div id="arContainer"></div>

<script type="module" src="main.js"></script>

</body>
</html>
