<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>AR Therapy Ball</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>


<style>
html,body { height:100%; margin:0; background:#000; color:#fff; font-family:system-ui; }

#hint {
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 14px;
  border-radius:999px;
  background:rgba(0,0,0,.6);
  z-index:3000;
}

#arContainer {
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:3000;
}

canvas {
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#toggleInfo {
  position:fixed;
  bottom:70px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;

  padding:8px 16px;
  border-radius:999px;
  border:none;

  font-weight:bold;
  background:rgba(255,255,255,0.2);
  color:white;

  backdrop-filter:blur(6px);

  opacity:0;
  pointer-events:none;
  transition:.3s;
}

</style>
</head>

<body>

<div id="hint">Tap ENTER AR</div>
<button id="toggleInfo">Info</button>


<div id="arContainer"></div>

<script type="module" src="main.js"></script>

</body>
</html>
