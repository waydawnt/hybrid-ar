<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Android WebXR AR</title>

<link rel="stylesheet" href="android.css">

<!-- UPDATED A-Frame -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<!-- hit test -->
<script src="https://cdn.jsdelivr.net/npm/aframe-hit-test-component@3.0.0/dist/aframe-hit-test-component.min.js"></script>

</head>

<body>

<!-- ENTER AR -->
<div id="enterWrapper">
  <button id="enterAR">ENTER AR</button>
  <div id="enterMsg">Tap to start AR</div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="hint">Ready</div>
  <div id="controls">
    <button id="placeBtn" class="btn">Place</button>
    <button id="fallbackBtn" class="btn alt" style="display:none">Place Anyway</button>
    <button id="resetBtn" class="btn alt">Reset</button>
  </div>
</div>

<!-- SCENE -->
<a-scene
  id="scene"

  vr-mode-ui="enabled:false"
  xr-mode-ui="enabled:false"

  renderer="
    alpha:true;
    colorManagement:true;
    physicallyCorrectLights:true;
  "

  webxr="
    requiredFeatures: hit-test, local-floor;
  "

  embedded>

  <!-- reticle -->
  <a-entity id="reticle" visible="false">
    <a-ring
      radius-inner="0.06"
      radius-outer="0.08"
      rotation="-90 0 0"
      material="color:#08f;opacity:0.9">
    </a-ring>
  </a-entity>

  <!-- camera -->
  <a-camera
    id="camera"
    wasd-controls-enabled="false"
    hit-test="target:#reticle">
  </a-camera>

  <!-- model -->
  <a-entity
    id="ball"
    gltf-model="model.glb"
    visible="false"
    scale="0.4 0.4 0.4">
  </a-entity>

</a-scene>

<script src="android.js"></script>

</body>
</html>
